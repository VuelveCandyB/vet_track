<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Diagnóstico animado</title>
<style>
  /* ===== Icono diagnóstico animado ===== */
  .med-diag { display: inline-block; line-height: 0; }
  .med-diag .scan {
    transform-origin: 60px 60px;
    animation: medScanMove 3.4s ease-in-out infinite;
  }
  .med-diag .pulse-green {
    animation: medPulseDash 2.6s linear infinite;
  }
  @keyframes medScanMove {
    0%, 100% { transform: translateX(-24px); }
    50%      { transform: translateX(24px); }
  }
  @keyframes medPulseDash {
    to { stroke-dashoffset: -240; }
  }
  @media (prefers-reduced-motion: reduce) {
    .med-diag .scan, .med-diag .pulse-green { animation: none; }
  }
</style>
</head>
<body style="margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#f4f5f3">

  <!-- ▼▼ COPIA DESDE AQUÍ ▼▼ -->
  <span class="med-diag" role="img" aria-label="diagnóstico">
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
      <polyline points="14,62 38,62 47,62 54,40 64,82 72,62 106,62"
        fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline class="pulse-green" points="14,62 38,62 47,62 54,40 64,82 72,62 106,62"
        fill="none" stroke="#1f9d6b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="26 214"/>
      <g class="scan">
        <circle cx="60" cy="58" r="22" fill="#1f9d6b" fill-opacity="0.14"/>
        <circle cx="60" cy="58" r="22" fill="none" stroke="#141414" stroke-width="3.5"/>
        <line x1="76" y1="74" x2="92" y2="90" stroke="#141414" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </svg>
  </span>
  <!-- ▲▲ COPIA HASTA AQUÍ (más el bloque <style> del <head>) ▲▲ -->

</body>
</html>
