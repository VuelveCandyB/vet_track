<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vacunación animada</title>
<style>
  .vac-icon { display: inline-block; line-height: 0; }
  /* empuje de toda la jeringa a lo largo del eje diagonal (hacia abajo-izquierda) */
  .vac-icon .syringe { transform-origin: 60px 60px; animation: vacInject 2.8s ease-in-out infinite; }
  /* émbolo: se hunde en el eje local X (hacia la aguja) */
  .vac-icon .plunger { animation: vacPlunger 2.8s ease-in-out infinite; }
  .vac-icon .drop { transform-origin: 24px 96px; animation: vacDrop 2.8s ease-in-out infinite; }
  @keyframes vacInject {
    0%, 100% { transform: translate(0,0); }
    35%      { transform: translate(-10px,10px); }
    62%      { transform: translate(-10px,10px); }
    90%      { transform: translate(0,0); }
  }
  @keyframes vacPlunger {
    0%, 34%   { transform: translateX(0); }
    60%, 100% { transform: translateX(-15px); }
  }
  @keyframes vacDrop {
    0%, 58%  { opacity: 0; transform: translate(-2px,-2px); }
    72%      { opacity: 1; transform: translate(-4px,4px); }
    100%     { opacity: 0; transform: translate(-9px,9px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .vac-icon .syringe, .vac-icon .plunger, .vac-icon .drop { animation: none; }
  }
</style>
</head>
<body style="margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center">

  <!-- ▼▼ COPIA DESDE AQUÍ ▼▼ (fondo transparente) -->
  <span class="vac-icon" role="img" aria-label="vacunación">
    <svg width="160" height="160" viewBox="0 0 120 120" fill="none">
      <!-- gota en la punta -->
      <circle class="drop" cx="24" cy="96" r="3.5" fill="#1f9d6b"/>

      <!-- jeringa dibujada horizontal, rotada -45° como bloque -->
      <g class="syringe">
        <g transform="rotate(-45 60 60)">
          <!-- aguja -->
          <line x1="8" y1="60" x2="24" y2="60" stroke="#141414" stroke-width="2.5" stroke-linecap="round"/>
          <!-- cono / hub -->
          <line x1="24" y1="60" x2="33" y2="60" stroke="#141414" stroke-width="5" stroke-linecap="round"/>
          <!-- cuerpo -->
          <rect x="33" y="49" width="45" height="22" rx="3" fill="none" stroke="#141414" stroke-width="3.5"/>
          <!-- líquido verde -->
          <rect x="36" y="52.5" width="21" height="15" rx="1.5" fill="#1f9d6b" opacity="0.55"/>
          <!-- reborde -->
          <line x1="78" y1="45" x2="78" y2="75" stroke="#141414" stroke-width="4" stroke-linecap="round"/>
          <!-- émbolo (retrocede/entra en X local) -->
          <g class="plunger">
            <line x1="78" y1="60" x2="99" y2="60" stroke="#141414" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="99" y1="51" x2="99" y2="69" stroke="#141414" stroke-width="4" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </svg>
  </span>
  <!-- ▲▲ COPIA HASTA AQUÍ (más el bloque <style> del <head>) ▲▲ -->

</body>
</html>
