<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>SOS salvavidas — logo animado</title>
<style>
  /* ===== Logo SOS con salvavidas + sonar ===== */
  .sos-logo { position: relative; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-family: Arial, Helvetica, sans-serif; color: inherit; cursor: pointer; transition: opacity 0.2s ease; }
  .sos-logo:hover { opacity: 0.8; }
  .sos-logo .buoy-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; }
  .sos-logo .sonar { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ff6b6b; opacity: .55; animation: sosSonar 2.2s ease-out infinite; }
  .sos-logo .sos-text { font-weight: 600; font-size: 13px; letter-spacing: .08em; }
  @keyframes sosSonar {
    0%   { transform: scale(.55); opacity: .7; }
    80%  { transform: scale(2); opacity: 0; }
    100% { transform: scale(2); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sos-logo .sonar { animation: none; }
  }
</style>
</head>
<body style="margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#63b39a">

  <!-- ▼▼ COPIA DESDE AQUÍ ▼▼   (color = color del texto: pon color:#fff en tu navbar) -->
  <a href="#" class="sos-logo" style="color:#ffffff">
    <span class="buoy-wrap">
      <span class="sonar"></span>
      <svg width="22" height="22" viewBox="0 0 40 40" style="position:relative">
        <circle cx="20" cy="20" r="17" fill="none" stroke="white" stroke-width="4.5"/>
        <circle cx="20" cy="20" r="6.5" fill="none" stroke="white" stroke-width="2.5"/>
        <line x1="20" y1="3"    x2="20" y2="10.5" stroke="#1f9d6b" stroke-width="4.5"/>
        <line x1="20" y1="29.5" x2="20" y2="37"   stroke="#1f9d6b" stroke-width="4.5"/>
        <line x1="3"  y1="20"   x2="10.5" y2="20" stroke="#1f9d6b" stroke-width="4.5"/>
        <line x1="29.5" y1="20" x2="37"  y2="20"  stroke="#1f9d6b" stroke-width="4.5"/>
      </svg>
    </span>
    <span class="sos-text">SOS</span>
  </a>
  <!-- ▲▲ COPIA HASTA AQUÍ (más el bloque <style> del <head>) ▲▲ -->

</body>
</html>
